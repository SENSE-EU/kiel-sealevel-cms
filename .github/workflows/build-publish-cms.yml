name: Build and publish the "cms" image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: cms-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: acrkielweupoc.azurecr.io
  IMAGE_NAME: kiel-sealevel-cms

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tags
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"

          if [[ "$REF_TYPE" == "branch" ]]; then
            TAGS="$IMAGE:staging"
            PUBLIC_URL="${{ vars.PUBLIC_URL_STAGING }}"

          elif [[ "$REF_TYPE" == "tag" ]]; then
            VERSION="${REF_NAME#v}"

            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version: $REF_NAME"
              exit 1
            fi

            TAGS="$IMAGE:preprod
          $IMAGE:$VERSION"

            PUBLIC_URL="${{ vars.PUBLIC_URL_PREPROD }}"

          else
            echo "Unsupported ref type"
            exit 1
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
            echo "public_url=$PUBLIC_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and publish CMS
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          build-args: | 
            PUBLIC_URL=${{ steps.meta.outputs.public_url }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
